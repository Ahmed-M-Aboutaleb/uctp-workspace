services:
    db:
        image: postgres:18.3-alpine3.23
        container_name: uctp-postgres
        restart: always
        environment:
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
            POSTGRES_DB: ${POSTGRES_DB}
            PGDATA: /var/lib/postgresql/data/pgdata
        volumes:
            - postgres_data:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
            interval: 5s
            timeout: 5s
            retries: 5
        networks:
            - backend_network
    redis:
        image: redis:8.6.2-alpine
        container_name: uctp-redis
        restart: always
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 5s
            timeout: 3s
            retries: 5
        networks:
            - backend_network
    backend:
        build:
            context: ./backend
            dockerfile: Dockerfile
        container_name: uctp-backend
        command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
        restart: unless-stopped
        env_file:
            - .env
        ports:
            - "8000:8000"
        depends_on:
            db:
                condition: service_healthy
            redis:
                condition: service_healthy
        networks:
            - backend_network
            - frontend_network
        volumes:
            - ./backend:/app
            - ./logs:/app/logs
    worker:
        build:
            context: ./backend
            dockerfile: Dockerfile
        container_name: uctp-rq-worker
        command: rq worker -u ${REDIS_URL} high default low
        restart: unless-stopped
        env_file:
            - .env
        depends_on:
            redis:
                condition: service_healthy
            db:
                condition: service_healthy
        networks:
            - backend_network
        volumes:
            - ./backend:/app
            - ./logs:/app/logs
    frontend:
        build:
            context: ./frontend
            dockerfile: Dockerfile
            args:
                NEXT_PUBLIC_API_URL: "http://localhost:8000"
        container_name: uctp-frontend
        environment:
            NODE_ENV: production
            PORT: "3000"
            API_URL: "http://backend:8000"
        ports:
            - "3000:3000"
        restart: unless-stopped
        networks:
            - frontend_network
volumes:
    postgres_data:

networks:
    backend_network:
        driver: bridge
    frontend_network:
        driver: bridge